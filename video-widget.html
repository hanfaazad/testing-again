<!-- ========== TALKING VIDEO WIDGET (self-contained) ========== -->
<style>
  .video-wrap{
    position:relative;
    width:100%;
    max-width:900px;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    box-shadow:0 10px 30px rgba(15,74,74,.18);
  }
  .video-wrap img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .girl{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    height:112%;
    display:block;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));
  }
  .girl img{
    height:100%;
    width:auto;
    display:block;
  }
  .girl img.mouth-open{
    position:absolute;
    top:0; left:0;
    opacity:0;
  }
  .girl.talking img.mouth-closed{ animation:blink-mouth 0.32s steps(1) infinite; }
  .girl.talking img.mouth-open{ animation:blink-mouth-open 0.32s steps(1) infinite; }
  @keyframes blink-mouth{
    0%,49%{opacity:1;} 50%,100%{opacity:0;}
  }
  @keyframes blink-mouth-open{
    0%,49%{opacity:0;} 50%,100%{opacity:1;}
  }
  .caption-bubble{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,.94);
    color:#12262b;
    padding:8px 18px;
    border-radius:999px;
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    opacity:0;
    transition:opacity .25s ease;
    pointer-events:none;
    font-family:'Segoe UI', system-ui, sans-serif;
  }
  .caption-bubble.show{opacity:1;}
  .controls{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 18px;
    background:linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,0));
  }
  .play-btn{
    width:42px;height:42px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.95);
    color:#0f4a4a;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:17px;
    flex-shrink:0;
    transition:transform .12s ease;
  }
  .play-btn:hover{transform:scale(1.06);}
  .progress{
    flex:1;
    height:5px;
    background:rgba(255,255,255,.3);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:#c9a24b;
    border-radius:3px;
    transition:width .1s linear;
  }
  .cc-btn{
    width:38px;height:30px;
    border-radius:6px;
    border:1.5px solid rgba(255,255,255,.85);
    background:rgba(0,0,0,.35);
    color:#fff;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    flex-shrink:0;
  }
  .cc-btn.active{background:#c9a24b;border-color:#c9a24b;color:#12262b;}
</style>

<div class="video-wrap" id="videoWrap">
  <!-- 1. BACKGROUND IMAGE — change src to your file -->
  <img class="bg" src="backgound.jpg" alt="background">

  <div class="girl" id="girl">
    <!-- 2. CHARACTER IMAGES — change src to your two files -->
    <img class="mouth-closed" src="transparent.png" alt="teacher">
    <img class="mouth-open" src="transparent2.png" alt="teacher talking">
  </div>

  <div class="caption-bubble" id="caption"></div>

  <div class="controls">
    <button class="play-btn" id="playBtn">&#9658;</button>
    <div class="progress" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <button class="cc-btn active" id="ccBtn">CC</button>
  </div>
</div>

<script>
(function(){
  const girl = document.getElementById('girl');
  const playBtn = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  const caption = document.getElementById('caption');
  const ccBtn = document.getElementById('ccBtn');

  let ccOn = true;
  ccBtn.addEventListener('click', () => {
    ccOn = !ccOn;
    ccBtn.classList.toggle('active', ccOn);
  });

  // 3. SCRIPT — add/edit lines here. "audio" is the file to play, "dur" is
  // that file's length in milliseconds (so animation/captions match it).
  const script = [
    { text: 'Alif', audio: 'alif.mp3', dur: 1600 },
    { text: 'Baa',  audio: 'baa.mp3',  dur: 1600 }
  ];
  const totalDur = script.reduce((a,s)=>a+s.dur, 0) + 400;

  let playing = false;
  let startTime = 0;
  let rafId = null;
  let currentAudio = null;

  function playSound(file){
    currentAudio = new Audio(file);
    currentAudio.play();
  }

  function setCaption(text){
    caption.textContent = text;
    caption.classList.toggle('show', !!text && ccOn);
  }

  function stopAll(){
    playing = false;
    girl.classList.remove('talking');
    playBtn.innerHTML = '&#9658;';
    caption.classList.remove('show');
    if(rafId) cancelAnimationFrame(rafId);
    if(currentAudio){ currentAudio.pause(); currentAudio.currentTime = 0; }
  }

  function tick(){
    if(!playing) return;
    const elapsed = Date.now() - startTime;
    const pct = Math.min(100, (elapsed/totalDur)*100);
    progressFill.style.width = pct + '%';
    if(elapsed >= totalDur){
      stopAll();
      progressFill.style.width = '0%';
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function playLesson(){
    if(playing) return;
    playing = true;
    playBtn.innerHTML = '&#10074;&#10074;';
    girl.classList.add('talking');
    startTime = Date.now();
    tick();

    let offset = 0;
    script.forEach(line => {
      setTimeout(() => {
        if(!playing) return;
        setCaption(line.text);
        playSound(line.audio);
      }, offset);
      offset += line.dur;
    });
    setTimeout(() => { if(playing) stopAll(); }, totalDur);
  }

  playBtn.addEventListener('click', () => {
    if(playing){ stopAll(); progressFill.style.width='0%'; }
    else { playLesson(); }
  });
})();
</script>
<!-- ========== END WIDGET ========== -->
