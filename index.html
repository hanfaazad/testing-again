<!-- ========== TALKING VIDEO WIDGET (self-contained) ========== -->
<style>
  .video-wrap{
    position:relative;
    width:100%;
    max-width:900px;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    box-shadow:0 10px 30px rgba(15,74,74,.18);
  }
  .video-wrap img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .girl{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    height:80%;
    display:block;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));
  }
  .girl img{
    height:100%;
    width:auto;
    display:block;
  }
  .girl img.mouth-open{
    position:absolute;
    top:0; left:0;
    opacity:0;
  }
  .girl.talking img.mouth-closed{ animation:blink-mouth 0.60s steps(1) infinite; }
  .girl.talking img.mouth-open{ animation:blink-mouth-open 0.60s steps(1) infinite; }
  @keyframes blink-mouth{
    0%,49%{opacity:1;} 50%,100%{opacity:0;}
  }
  @keyframes blink-mouth-open{
    0%,49%{opacity:0;} 50%,100%{opacity:1;}
  }
  .caption-bubble{
    position:absolute;
    top:240px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,.94);
    color:#12262b;
    padding:8px 18px;
    border-radius:999px;
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    opacity:0;
    transition:opacity .25s ease;
    pointer-events:none;
    font-family:'Segoe UI', system-ui, sans-serif;
  }
  .caption-bubble.show{opacity:1;}
  .controls{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 18px;
    background:linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,0));
  }
  .play-btn{
    width:42px;height:42px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.95);
    color:#0f4a4a;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:17px;
    flex-shrink:0;
    transition:transform .12s ease;
  }
  .play-btn:hover{transform:scale(1.06);}
  .progress{
    flex:1;
    height:5px;
    background:rgba(255,255,255,.3);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:#c9a24b;
    border-radius:3px;
    transition:width .1s linear;
  }
  .cc-btn{
    width:38px;height:30px;
    border-radius:6px;
    border:1.5px solid rgba(255,255,255,.85);
    background:rgba(0,0,0,.35);
    color:#fff;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    flex-shrink:0;
  }
  .cc-btn.active{background:#c9a24b;border-color:#c9a24b;color:#12262b;}
</style>

<div class="video-wrap" id="videoWrap">
  <!-- 1. BACKGROUND IMAGE — change src to your file -->
  <img class="bg" src="backgound.png" alt="background">

  <div class="girl" id="girl">
    <!-- 2. CHARACTER IMAGES — change src to your two files -->
    <img class="mouth-closed" src="transparent.png" alt="teacher">
    <img class="mouth-open" src="transparent2.png" alt="teacher talking">
  </div>

  <div class="caption-bubble" id="caption"></div>

  <div class="controls">
    <button class="play-btn" id="playBtn">&#9658;</button>
    <div class="progress" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <button class="cc-btn active" id="ccBtn">CC</button>
  </div>
</div>

<script>
(function(){
  const girl = document.getElementById('girl');
  const playBtn = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  const caption = document.getElementById('caption');
  const ccBtn = document.getElementById('ccBtn');

  let ccOn = true;
  ccBtn.addEventListener('click', () => {
    ccOn = !ccOn;
    ccBtn.classList.toggle('active', ccOn);
  });

  // 3. SCRIPT — add/edit lines here. "audio" is the file to play, "dur" is
  // that file's length in milliseconds (so animation/captions match it).
  // "pause" is the silent gap after this word before the next one starts.
  const script = [
    { text: 'ب', audio: 'baaa.m4a', dur: 1000, pause: 500 },
    { text: 'ت',  audio: 'taaa.m4a',  dur: 1400, pause: 500 },
    { text: 'ث', audio: 'thaaa.m4a', dur: 1600, pause: 500 },
    { text: 'ج', audio: 'jeem.m4a', dur: 1600, pause: 500 },
    { text: 'ح', audio: 'haaa.m4a', dur: 1600, pause: 500 }
  ];
  const leadIn = 1000;
  // precompute the start time (offset) of each line within the whole timeline
  let _offset = leadIn;
  const timeline = script.map(line => {
    const start = _offset;
    _offset += line.dur + (line.pause || 0);
    return { ...line, start };
  });
  const totalDur = _offset;

  let playing = false;
  let elapsed = 0;            // how far into the whole timeline we are (ms)
  let segmentStartClock = 0;  // Date.now() when current run began
  let rafId = null;
  let timeouts = [];
  let currentAudio = null;

  function clearTimeouts(){
    timeouts.forEach(id => clearTimeout(id));
    timeouts = [];
  }

  function setCaption(text){
    caption.textContent = text;
    caption.classList.toggle('show', !!text && ccOn);
  }

  function playSound(file, offsetSec){
    if(!file) return;
    currentAudio = new Audio(file);
    currentAudio.currentTime = offsetSec || 0;
    currentAudio.play();
  }

  function pauseAll(){
    playing = false;
    playBtn.innerHTML = '&#9658;';
    girl.classList.remove('talking');
    if(rafId) cancelAnimationFrame(rafId);
    clearTimeouts();
    if(currentAudio){ currentAudio.pause(); } // keeps position, doesn't reset
    elapsed = elapsed + (Date.now() - segmentStartClock);
  }

  function resetAll(){
    pauseAll();
    elapsed = 0;
    progressFill.style.width = '0%';
    setCaption('');
    if(currentAudio){ currentAudio.currentTime = 0; }
  }

  function tick(){
    if(!playing) return;
    const now = elapsed + (Date.now() - segmentStartClock);
    const pct = Math.min(100, (now/totalDur)*100);
    progressFill.style.width = pct + '%';
    if(now >= totalDur){
      resetAll();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function scheduleFrom(startMs){
    for(const line of timeline){
      const lineEnd = line.start + line.dur;
      const lineEndWithPause = line.start + line.dur + (line.pause || 0);

      if(startMs < line.start){
        // this whole line is still ahead — schedule it fully
        const delayToStart = line.start - startMs;
        const delayToEnd = lineEnd - startMs;
        timeouts.push(setTimeout(() => {
          if(!playing) return;
          girl.classList.add('talking');
          setCaption(line.text);
          playSound(line.audio, 0);
        }, delayToStart));
        timeouts.push(setTimeout(() => {
          if(!playing) return;
          girl.classList.remove('talking');
          setCaption('');
        }, delayToEnd));
      }
      else if(startMs >= line.start && startMs < lineEnd){
        // resumed in the MIDDLE of this line's talking part
        const audioOffsetSec = (startMs - line.start) / 1000;
        girl.classList.add('talking');
        setCaption(line.text);
        playSound(line.audio, audioOffsetSec);
        const delayToEnd = lineEnd - startMs;
        timeouts.push(setTimeout(() => {
          if(!playing) return;
          girl.classList.remove('talking');
          setCaption('');
        }, delayToEnd));
      }
      else if(startMs >= lineEnd && startMs < lineEndWithPause){
        // resumed during this line's silent pause — mouth stays closed
        girl.classList.remove('talking');
        setCaption('');
      }
      // else: this line is fully in the past, skip it
    }
  }

  function playFrom(startMs){
    playing = true;
    playBtn.innerHTML = '&#10074;&#10074;';
    segmentStartClock = Date.now();
    scheduleFrom(startMs);
    tick();
  }

  playBtn.addEventListener('click', () => {
    if(playing){
      pauseAll();
    } else {
      if(elapsed >= totalDur){ elapsed = 0; } // finished before, restart clean
      playFrom(elapsed);
    }
  });
})();
</script>
<!-- ========== END WIDGET ========== -->
